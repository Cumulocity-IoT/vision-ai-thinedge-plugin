# MediaMTX configuration for Vision AI WebRTC streaming
# https://github.com/bluenviron/mediamtx

###############################################
# HTTP API
###############################################
api: yes
apiAddress: 127.0.0.1:9997

###############################################
# RTSP server (internal loopback use only)
###############################################
rtspAddress: :8554

###############################################
# WebRTC
###############################################
webrtc: yes
webrtcAddress: :8555

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

###############################################
# Logging
###############################################
logLevel: info
logDestinations: [stdout]

###############################################
# Stream paths
###############################################
paths:
  tedge_cam:
    # FFmpeg reads raw BGR24 frames from the named pipe and publishes
    # to MediaMTX via RTSP. h264_v4l2m2m uses the Pi's hardware encoder.
    runOnInit: >-
      ffmpeg
      -f rawvideo -pix_fmt bgr24 -s 640x480 -r 15
      -i /tmp/vai_raw_stream.pipe
      -c:v h264_v4l2m2m -b:v 2000k
      -f rtsp rtsp://localhost:8554/tedge_cam
    runOnInitRestart: yes
