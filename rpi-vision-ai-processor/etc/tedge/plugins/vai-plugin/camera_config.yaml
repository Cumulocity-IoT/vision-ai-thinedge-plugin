cameras:
  camera:
    id: "ai_camera"
    metadata:
      model: default
      framerate: 15
      threshold: 0.3
      modeltype: object detection  #either "object detection" or "classification"
      bbox_normalization: False
      bbox_order: yx
      output_order: bscn
      max_detections: 5
    tracker:
      track_thresh: 0.25
      track_buffer: 30
      match_thresh: 0.8
      aspect_ratio_thresh: 3.0
      min_box_area: 1.0
      mot20: False
    # WebRTC Video Streaming Configuration
    # Streams H.264-encoded video with detection overlays via RTSP to go2rtc,
    # which serves WebRTC/RTSP to clients.
    streaming:
      enabled: true
      rtsp_url: "rtsp://127.0.0.1:8554/tedge_cam"  # must match go2rtc rtsp.listen address and stream name
      encoder: "libx264"  # ffmpeg encoder: "h264_v4l2m2m" (Pi hardware) or "libx264" (software)

